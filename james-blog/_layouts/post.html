---
layout: default
---
<article>
  <header class="article-head">
    <a class="back" href="{{ '/' | relative_url }}">← 全部文章</a>
    <h1>{{ page.title | escape }}</h1>
    <time class="muted" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
  </header>
  <div class="prose">{{ content }}</div>
</article>
