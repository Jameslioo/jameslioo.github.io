<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/archive/' %} aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
        <a href="https://github.com/Jameslioo">GitHub ↗</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.title | escape }} <span>用文字留住思考。</span></footer>
  </div>
</body>
</html>
